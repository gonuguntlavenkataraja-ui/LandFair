
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LandFair - Fair Land Compensation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1 id="siteTitle">LandFair</h1>
    <p id="tagline">Know your land. Understand your compensation.</p>

    <div class="language-switch" aria-label="Choose language">
        <button type="button" id="englishBtn">English</button>
        <button type="button" id="teluguBtn">తెలుగు</button>
    </div>
</header>

    <!-- <header>
        <h1>LandFair</h1>
        <p>Know your land. Understand your compensation.</p>
    </header> -->

    <main>
        <h2>Check Your Land Compensation</h2>

        <p>
            Enter your land details to begin understanding
            government land acquisition compensation.
        </p>

        
           
<form id="landForm" novalidate>
    <div class="form-grid">

        <div class="form-group">
            <label for="district">District:</label>
            <input
                type="text"
                id="district"
                placeholder="Enter your district"
                required
            >
        </div>

        <div class="form-group">
            <label for="village">Village:</label>
            <input
                type="text"
                id="village"
                placeholder="Enter your village"
                required
            >
        </div>

        <div class="form-group">
            <label for="survey">Survey Number:</label>
            <input
                type="text"
                id="survey"
                placeholder="Enter survey number"
                required
            >
        </div>

        <div class="form-group">
            <label for="area">Land Extent (acres):</label>
            <input
                type="number"
                id="area"
                min="0.01"
                step="any"
                placeholder="For example, 2.5"
                required
            >
        </div>

        <div class="form-group full-width">
            <label for="project">Government Project:</label>
            <select id="project" required>
                <option value="">Select a project</option>
                <option value="road">Road</option>
                <option value="railway">Railway</option>
                <option value="port">Port</option>
                <option value="industry">Industrial project</option>
                <option value="other">Other</option>
            </select>
        </div>
        
<div class="form-group full-width">
    <label for="landCategory">Land Category:</label>
    <select id="landCategory" required>
        <option value="">Select land category</option>
        <option value="agricultural">Agricultural</option>
        <option value="non-agricultural">Non-agricultural</option>
    </select>
</div>


    </div>

    <button type="submit">Check Compensation</button>
</form>

        
        <section id="landSummary" hidden>
    <h2>Land Details Summary</h2>
    <div id="summaryContent"></div>
</section>
        <div id="formMessage"
     role="status"
     aria-live="polite"></div>
    </main>

    <footer>
        <p>LandFair | Supporting informed landowners</p>
    </footer>
<script src="script.js"></script>
</body>
</html>
